name: Deploy GrandStay Hotel SaaS to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==============================================================
  # JOB 1: BUILD FRONTEND SPA
  # ==============================================================
  build-frontend:
    name: Build Frontend (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend for Production
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://sasapi.u2tech.in/api/v1
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ==============================================================
  # JOB 2: DEPLOY TO HOSTINGER VPS VIA SSH
  # ==============================================================
  deploy:
    name: Deploy to CloudPanel (sas.u2tech.in & sasapi.u2tech.in)
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Install Deploy Utilities
        run: sudo apt-get update -y && sudo apt-get install -y rsync sshpass

      - name: Setup SSH Connection
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_PRIVATE_KEY" ]; then
            printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
          fi
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      # ----------------------------------------------------------
      # Deploy Frontend -> sas.u2tech.in/public
      # ----------------------------------------------------------
      - name: Deploy Frontend to sas.u2tech.in
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "Deploying frontend build to /home/u2tech-sas/htdocs/sas.u2tech.in/public/..."
          if [ -n "$SSH_PASS" ]; then
            SSHPASS="$SSH_PASS" rsync -avz --delete \
              -e "sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no" \
              dist/ \
              $SSH_USER@$SSH_HOST:/home/u2tech-sas/htdocs/sas.u2tech.in/public/

            SSHPASS="$SSH_PASS" sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
              "chown -R u2tech-sas:u2tech-sas /home/u2tech-sas/htdocs/sas.u2tech.in"
          else
            rsync -avz --delete \
              -e "ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o StrictHostKeyChecking=no" \
              dist/ \
              $SSH_USER@$SSH_HOST:/home/u2tech-sas/htdocs/sas.u2tech.in/public/

            ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
              "chown -R u2tech-sas:u2tech-sas /home/u2tech-sas/htdocs/sas.u2tech.in"
          fi

      # ----------------------------------------------------------
      # Deploy Backend -> sasapi.u2tech.in
      # ----------------------------------------------------------
      - name: Deploy Backend Files to sasapi.u2tech.in
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "Syncing Laravel Backend to /home/u2tech-sasapi/htdocs/sasapi.u2tech.in/..."
          if [ -n "$SSH_PASS" ]; then
            SSHPASS="$SSH_PASS" rsync -avz --delete \
              --exclude='.env' \
              --exclude='storage/' \
              --exclude='vendor/' \
              --exclude='node_modules/' \
              --exclude='.git/' \
              -e "sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no" \
              backend/ \
              $SSH_USER@$SSH_HOST:/home/u2tech-sasapi/htdocs/sasapi.u2tech.in/
          else
            rsync -avz --delete \
              --exclude='.env' \
              --exclude='storage/' \
              --exclude='vendor/' \
              --exclude='node_modules/' \
              --exclude='.git/' \
              -e "ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o StrictHostKeyChecking=no" \
              backend/ \
              $SSH_USER@$SSH_HOST:/home/u2tech-sasapi/htdocs/sasapi.u2tech.in/
          fi

      # ----------------------------------------------------------
      # Provision PostgreSQL & Run Remote Setup Script
      # ----------------------------------------------------------
      - name: Provision PostgreSQL & Execute Remote Laravel Setup
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "Executing PostgreSQL server provisioning and post-deployment setup..."
          if [ -n "$SSH_PASS" ]; then
            SSHPASS="$SSH_PASS" sshpass -e ssh -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST 'bash -s' < scripts/install-postgres-server.sh
          else
            ssh -i ~/.ssh/id_rsa -p $SSH_PORT -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST 'bash -s' < scripts/install-postgres-server.sh
          fi
