name: Deploy GrandStay Hotel SaaS to Hostinger VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==============================================================
  # JOB 1: BUILD FRONTEND SPA
  # ==============================================================
  build-frontend:
    name: Build Frontend (Vite + React)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build Frontend for Production
        working-directory: ./frontend
        env:
          VITE_API_BASE_URL: https://sasapi.u2tech.in/api/v1
        run: npm run build

      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ==============================================================
  # JOB 2: DEPLOY TO HOSTINGER VPS VIA SSH
  # ==============================================================
  deploy:
    name: Deploy to CloudPanel (sas.u2tech.in & sasapi.u2tech.in)
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Frontend Build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SSH_PORT || 22 }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ----------------------------------------------------------
      # Deploy Frontend -> sas.u2tech.in
      # ----------------------------------------------------------
      - name: Deploy Frontend Files to sas.u2tech.in
        run: |
          echo "Deploying frontend build to /home/u2tech-sas/htdocs/sas.u2tech.in/..."
          rsync -avz --delete -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            dist/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u2tech-sas/htdocs/sas.u2tech.in/

          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "chown -R u2tech-sas:u2tech-sas /home/u2tech-sas/htdocs/sas.u2tech.in"

      # ----------------------------------------------------------
      # Deploy Backend -> sasapi.u2tech.in
      # ----------------------------------------------------------
      - name: Deploy Backend Files to sasapi.u2tech.in
        run: |
          echo "Syncing Laravel Backend to /home/u2tech-sasapi/htdocs/sasapi.u2tech.in/..."
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.git/' \
            -e "ssh -p ${{ secrets.SSH_PORT || 22 }}" \
            backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/u2tech-sasapi/htdocs/sasapi.u2tech.in/

      # ----------------------------------------------------------
      # Run Laravel Post-Deployment Artisan & Composer Commands
      # ----------------------------------------------------------
      - name: Execute Remote Laravel Setup & Optimization
        run: |
          ssh -p ${{ secrets.SSH_PORT || 22 }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'bash -se' << 'EOF'
            set -e
            BACKEND_DIR="/home/u2tech-sasapi/htdocs/sasapi.u2tech.in"
            cd "$BACKEND_DIR"

            echo "Ensuring required directories exist..."
            mkdir -p storage/framework/{sessions,views,cache} storage/logs bootstrap/cache

            # Check if .env exists, if not create from example
            if [ ! -f .env ]; then
              echo "Creating initial .env file..."
              cp .env.example .env
              php artisan key:generate --force
            fi

            echo "Installing composer production dependencies..."
            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            echo "Running database migrations..."
            php artisan migrate --force

            echo "Clearing and warming production caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Fixing file permissions..."
            chmod -R 775 storage bootstrap/cache
            chown -R u2tech-sasapi:u2tech-sasapi "$BACKEND_DIR"

            echo "Deployment completed successfully!"
          EOF
