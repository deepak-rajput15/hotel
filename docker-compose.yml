services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel_saas_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hotel_saas
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: secret_password
    volumes:
      - hotel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_user -d hotel_saas"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hotel_saas_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - hotel_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  hotel_postgres_data:
    driver: local
  hotel_redis_data:
    driver: local
